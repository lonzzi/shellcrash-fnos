name: Package upstream stable release
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Official stable ShellCrash release (blank = latest)'
        type: string
        default: ''
      mihomo_tag:
        description: 'Official stable Mihomo release (blank = latest)'
        type: string
        default: ''
      package_revision:
        description: 'Optional package revision override (blank = automatic)'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: package-release
  cancel-in-progress: false
jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}
      mihomo_tag: ${{ steps.check.outputs.mihomo_tag }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          MIHOMO_TAG: ${{ inputs.mihomo_tag }}
          PACKAGE_REVISION: ${{ inputs.package_revision }}
        run: python3 scripts/release.py detect
  build:
    needs: detect
    if: needs.detect.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: manager/go.mod
          cache-dependency-path: manager/go.sum
      - name: Download pinned fnpack
        run: |
          curl --fail --location --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 -o "$RUNNER_TEMP/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  $RUNNER_TEMP/fnpack" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fnpack"
      - name: Validate package source
        run: python3 scripts/check.py
      - name: Build native amd64 and ARM64 FPKs
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.tag }}
          MIHOMO_TAG: ${{ needs.detect.outputs.mihomo_tag }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
        run: python3 scripts/release.py build --tag "$UPSTREAM_TAG" --mihomo-tag "$MIHOMO_TAG" --version "$PACKAGE_VERSION" --fnpack "$RUNNER_TEMP/fnpack"
      - name: Smoke-test native Core, host TUN configuration, and fnOS gateway
        run: bash scripts/smoke.sh .build/package/x86
      - uses: actions/upload-artifact@v4
        with:
          name: fpk
          path: dist/
          if-no-files-found: error
  publish:
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fpk
          path: dist
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.detect.outputs.release_tag }}
          PACKAGE_VERSION: ${{ needs.detect.outputs.version }}
          MIHOMO_TAG: ${{ needs.detect.outputs.mihomo_tag }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$COMMIT" --title "ShellCrash $PACKAGE_VERSION for fnOS (Mihomo $MIHOMO_TAG)" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" ./*.fpk SHA256SUMS upstream.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false
